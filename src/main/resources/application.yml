spring:
  application:
    name: gov-data

  r2dbc:
    url: r2dbc:postgresql://172.17.0.6:5432/mydb
    username: myuser
    password: mypass
  
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  codec:
    max-in-memory-size: 5MB

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs        # JSON spec served at GET /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json
  show-actuator: false

# OpenAPI Registration Configuration
gov-api:
  openapi:
    max-endpoints: 50
    supported-versions:
      - "3.0"
      - "3.1"
    validation:
      strict-mode: true
      allow-warnings: false

  taxi:
    base-url: https://api.data.gov.sg
    api-key: ""
    fetch-interval-ms: 600000

